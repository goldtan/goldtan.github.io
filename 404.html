(function () {
  var cv = document.getElementById("broken-graph");
  if (!cv) return;
  var dpr = window.devicePixelRatio || 1;
  cv.width = 200 * dpr;
  cv.height = 200 * dpr;
  var ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);

  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  var col = dark ? "160,174,192" : "74,85,104";
  var accent = dark ? "#90cdf4" : "#3182ce";

  // Draw a broken graph
  var nodes = [
    {x: 40, y: 50}, {x: 100, y: 30}, {x: 160, y: 55},
    {x: 30, y: 120}, {x: 90, y: 140}, {x: 150, y: 125},
    {x: 70, y: 180}, {x: 130, y: 175},
  ];
  var edges = [[0,1],[1,2],[0,3],[3,4],[4,5],[2,5],[3,6],[4,7]];

  // draw edges — some dashed (broken)
  edges.forEach(function (e, i) {
    var a = nodes[e[0]], b = nodes[e[1]];
    ctx.beginPath();
    ctx.strokeStyle = "rgba(" + col + "," + (i % 3 === 0 ? "0.12" : "0.25") + ")";
    ctx.lineWidth = 0.8;
    if (i % 3 === 0) ctx.setLineDash([4, 4]);
    else ctx.setLineDash([]);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // draw nodes — one highlighted as "missing"
  nodes.forEach(function (n, i) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, i === 4 ? 6 : 4, 0, Math.PI * 2);
    if (i === 4) {
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = "rgba(" + col + ",0.4)";
      ctx.fill();
    }
  });

  // "?" on missing node
  ctx.font = "500 10px Inter, sans-serif";
  ctx.fillStyle = accent;
  ctx.textAlign = "center";
  ctx.fillText("?", nodes[4].x, nodes[4].y + 3.5);
})();
